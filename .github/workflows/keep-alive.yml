name: Keep Render App Awake

on:
  schedule:
    # Runs every 14 minutes. 
    # Render puts apps to sleep after 15 minutes of inactivity.
    # GitHub's minimum is 5 minutes, so we use 14 to be safe.
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual run from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render App Health Endpoint
        env:
          TARGET_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "Error: RENDER_HEALTH_URL secret is not set."
            exit 1
          fi
          echo "Pinging health endpoint..."
          curl -s -o /dev/null -w "HTTP Status: %{http_code}\nResponse Time: %{time_total}s\n" "$TARGET_URL"