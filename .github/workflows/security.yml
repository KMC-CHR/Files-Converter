name: CI Security and Quality Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagic1 ffmpeg

    - name: Install Python Tools
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit flake8 safety semgrep

    - name: Code Quality Linting (Flake8)
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Python Security Audit (Bandit)
      run: |
        bandit -r . -x ./.venv -ll

    - name: Dependency Vulnerability Check (Safety)
      run: |
        safety check || true

    - name: Advanced Static Analysis (Semgrep)
      run: |
        semgrep --config p/python --error

    - name: Docker Security Scan (Hadolint)
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: Dockerfile

    - name: Build Docker Image
      run: |
        docker build -t converter-app .

    - name: Container Image Vulnerability Scan (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'converter-app'
        format: 'table'
        exit-code: '0'
        ignore-unfixed: true
        severity: 'CRITICAL,HIGH'