name: Keep Render App Awake

on:
  schedule:
    # Runs every 14 minutes to keep the Render free web service from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          curl -s -f https://files-converter-3r5x.onrender.com/healthz > /dev/null || true
          echo "Keep-alive ping sent successfully."